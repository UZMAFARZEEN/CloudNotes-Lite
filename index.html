<!DOCTYPE html>
<html>
<head>
    <title>CloudNotes Lite</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;

        background-image: url("https://images.unsplash.com/photo-1503264116251-35a269479413");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: white;
    }

    h1 {
        background: rgba(0, 0, 0, 0.6);
        display: inline-block;
        padding: 10px 20px;
        border-radius: 10px;
    }

    p {
        background: rgba(0, 0, 0, 0.5);
        display: inline-block;
        padding: 8px 15px;
        border-radius: 8px;
    }

    input {
        padding: 10px;
        border-radius: 5px;
        border: none;
        width: 200px;
    }

    button {
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        background-color: #4CAF50;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background-color: #45a049;
    }

    ul {
        margin-top: 20px;
        list-style: none;
    }

    li {
        background: rgba(0, 0, 0, 0.6);
        margin: 10px auto;
        padding: 10px;
        width: 300px;
        border-radius: 8px;
    }

    .container {
        background: rgba(0, 0, 0, 0.6);
        padding: 20px;
        border-radius: 15px;
        display: inline-block;
    }
</style>
</head>

<body>
    <div class="container">
        <h1>CloudNotes Lite</h1>
        <p>A Real-Time Cloud-Based Note Synchronization System</p>

        <input type="text" id="noteInput" placeholder="Enter your note">
        <button onclick="addNote()">Add Note</button>
        <ul id="notesList"></ul>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    
    <script src="script.js"></script>
</body>
</html>
